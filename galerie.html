```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos réalisations - L69N Clean</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;

            background: url("background.png") no-repeat center center fixed;
            background-size: cover;
        }

        /* Fond sombre */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            z-index: -1;
        }

        h1 {
            color: #B68F38;
            margin-top: 40px;
            font-size: 32px;
        }

        .intro {
            color: #B68F38;
            font-size: 18px;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        /* Galerie */
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .gallery img {
            width: 350px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .back {
            display: inline-block;
            margin: 40px 0;
            color: #B68F38;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .back:hover {
            color: #d4af37;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 26px;
            }

            .intro {
                font-size: 16px;
            }

            .gallery {
                flex-direction: column;
                align-items: center;
            }

            .gallery img {
                width: 90%;
                max-width: 350px;
                height: auto;
            }

            .back {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

    <h1>Nos réalisations</h1>

    <p class="intro">
        Découvrez quelques exemples de nos prestations de nettoyage automobile
    </p>

    <div class="gallery">

        <img src="photo1.png" alt="Nettoyage automobile">
        <img src="photo2.png" alt="Nettoyage automobile">
        <img src="photo3.png" alt="Nettoyage automobile">
        <img src="photo4.png" alt="Nettoyage automobile">
        <img src="photo5.png" alt="Nettoyage automobile">

    </div>

    <a class="back" href="index.html">
        Retour à l'accueil
    </a>

</body>
</html>
